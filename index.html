<style>
*{box-sizing:border-box}
:root{--teal:#00f5d4;--purple:#7b2ff7;--bg:#0d0d1a;--sec:#111128;--card:#161630;--bd:rgba(0,245,212,.15);--tx:#f0f0ff;--tx2:#a0a0c0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 'Segoe UI',system-ui,-apple-system,sans-serif}
a{color:var(--teal);text-decoration:none}a:hover{color:#fff}
.in{max-width:1100px;margin:0 auto}
section{padding:88px 24px}
.alt{background:var(--sec)}
h2{font-size:40px;line-height:1.1;margin:0 0 12px}
h2 span{color:var(--teal)}
.sub{color:var(--tx2);font-size:18px;margin:0 0 48px;max-width:640px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
nav{position:sticky;top:0;z-index:10;background:rgba(13,13,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
nav .in{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:10px 24px}
.logo{font-weight:700;font-size:14px;letter-spacing:.04em;color:var(--teal)}
.links{display:flex;gap:22px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.links a{color:var(--tx2);font-size:15px;display:inline-block;padding:10px 0}.links a:hover{color:#fff}
.lang button{min-width:44px;min-height:44px;border-radius:8px;border:1px solid rgba(0,245,212,.3);background:transparent;color:var(--tx);cursor:pointer;font-weight:600}
.lang button.on{background:var(--teal);color:var(--bg);border-color:var(--teal)}
header.hero{padding:120px 24px;background:radial-gradient(ellipse at 20% 0%,#2a1263 0%,var(--bg) 60%)}
.badge{display:inline-block;padding:6px 16px;border-radius:999px;border:1px solid rgba(0,245,212,.4);color:var(--teal);font-size:14px}
h1{font-size:clamp(36px,6vw,68px);line-height:1.05;margin:24px 0;max-width:900px}
.hero p{font-size:20px;color:var(--tx2);max-width:640px;margin:0 0 32px}
.meta{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:40px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 32px;border-radius:12px;background:var(--teal);color:var(--bg);font-weight:700;font-size:17px;border:0;cursor:pointer;font-family:inherit}
.btn:hover{color:var(--bg);filter:brightness(1.1)}
.tl{display:grid;gap:16px}
.row{display:flex;gap:24px;flex-wrap:wrap}
.time{min-width:130px;color:var(--teal);font-weight:700}.time small{display:block;color:var(--tx2);font-weight:400;font-size:15px}
.row h3,.card h3{margin:0 0 6px;font-size:20px}.row p,.card p{margin:0;color:var(--tx2)}
.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--teal));display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--bg);margin-bottom:16px}
.role{color:var(--teal)!important;margin:0 0 10px!important}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.gal img{width:100%;height:190px;object-fit:cover;border-radius:12px;display:block;border:1px solid var(--bd)}
.faq{max-width:820px;display:grid;gap:12px}
.faq button{width:100%;min-height:56px;display:flex;justify-content:space-between;align-items:center;gap:16px;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:12px 20px;font-family:inherit;font-weight:600;font-size:18px;cursor:pointer}
.faq button[aria-expanded=true]{border-color:var(--teal);border-bottom-left-radius:0;border-bottom-right-radius:0}
.faq .ans{background:var(--card);border:1px solid var(--bd);border-top:0;border-radius:0 0 14px 14px;padding:16px 20px;color:var(--tx2);margin-top:-12px}
.lbl{display:block;font-size:14px;color:var(--tx2);margin-bottom:6px}
.fld{width:100%;min-height:48px;padding:0 14px;border-radius:10px;border:1px solid rgba(0,245,212,.3);background:var(--bg);color:var(--tx);font-family:inherit;font-size:16px}
.fld:focus{outline:2px solid var(--teal);outline-offset:1px}
.fld[aria-invalid=true]{border-color:#ff7a8a}
.err{color:#ff9aa6;font-size:14px;margin:6px 0 0;min-height:1em}
form{display:grid;gap:18px;max-width:640px}
.ok{max-width:640px;text-align:center}.ok h3{font-size:28px;color:var(--teal)}
footer{padding:32px 24px;text-align:center;color:var(--tx2);border-top:1px solid var(--bd)}
@media(max-width:700px){section{padding:64px 20px}h2{font-size:32px}.links{display:none}}
</style>
</head>

let lang=(localStorage.getItem('lang')||((navigator.language||'').startsWith('ro')?'ro':'en'));
if(!D[lang])lang='en';
const $=s=>document.querySelector(s);
const get=(o,p)=>p.split('.').reduce((a,k)=>a&&a[k],o);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
 const t=D[lang];
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-t]').forEach(el=>{const v=get(t,el.dataset.t);if(typeof v==='string')el.textContent=v});
 $('#tl').innerHTML=t.program.schedule.map(s=>`<div class="card row"><div class="time">${esc(s.time)}<small>${esc(s.location)}</small></div><div style="flex:1;min-width:240px"><h3>${esc(s.title)}</h3><p>${esc(s.desc)}</p></div></div>`).join('');
 $('#team').innerHTML=t.speakers.list.map(s=>`<div class="card"><div class="av">${esc(s.initials.slice(0,2))}</div><h3>${esc(s.name)}</h3><p class="role">${esc(s.title)}</p><p>${esc(s.bio)}</p></div>`).join('');
 $('#faqs').innerHTML=t.faq.list.map((q,i)=>`<div><button aria-expanded="false" aria-controls="a${i}" data-i="${i}"><span>${esc(q.question)}</span><span aria-hidden="true">+</span></button><div class="ans" id="a${i}" hidden>${esc(q.answer)}</div></div>`).join('');
 $('#n').placeholder=t.registration.placeholderName;$('#e').placeholder=t.registration.placeholderEmail;$('#c').placeholder=t.registration.placeholderCompany;
 $('#dir').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(t.venue.address);
 $('#b-en').classList.toggle('on',lang==='en');$('#b-ro').classList.toggle('on',lang==='ro');
 ['en','ee','ec'].forEach(i=>$('#'+i).textContent='');
}
document.addEventListener('click',e=>{
 const b=e.target.closest('.faq button');
 if(b){const open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',!open);b.lastChild.textContent=open?'+':'−';$('#'+b.getAttribute('aria-controls')).hidden=open}
});
function setLang(l){lang=l;try{localStorage.setItem('lang',l)}catch(e){}render()}
$('#b-en').onclick=()=>setLang('en');$('#b-ro').onclick=()=>setLang('ro');
$('#f').addEventListener('submit',e=>{
 e.preventDefault();const r=D[lang].registration;
 const n=$('#n').value.trim(),m=$('#e').value.trim(),c=$('#c').value.trim();
 const errs={en:n?'':r.errorName,ee:!m?r.errorEmailRequired:(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)?'':r.errorEmailInvalid),ec:c?'':r.errorCompany};
 const ids={en:'n',ee:'e',ec:'c'};let bad=false;
 for(const k in errs){$('#'+k).textContent=errs[k];$('#'+ids[k]).setAttribute('aria-invalid',!!errs[k]);if(errs[k])bad=true}
 if(bad)return;
 $('#okt').textContent=r.successTitle;$('#okm').textContent=r.successMsg.replace('{name}',n).replace('{email}',m);
 $('#f').hidden=true;$('#ok').hidden=false;
});
render();
</script>
</body>
